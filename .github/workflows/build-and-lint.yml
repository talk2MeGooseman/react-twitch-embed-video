name: Lint Code and Verify

on:
  push:
    branches:
      - development

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'
    - name: install
      run: |
        pnpm install

    - name: lint
      run: |
        pnpm lint

    - name: Check Build Storybook
      run: |
        pnpm release-storybook

    - name: Check Build Package Release
      run: |
        pnpm release
