name: Build and Release Tagged Version

on:
  release:
    types: [published]

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v2
      with:
        version: 6.32.9
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - name: pnpm install
      run: |
        pnpm install

    - name: pnpm lint
      run: |
        pnpm lint

    - name: Build Package Release
      run: |
        pnpm release

    - run: pnpm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN}}
